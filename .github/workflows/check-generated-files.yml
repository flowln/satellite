on:
  pull_request:
    paths:
      - "src/satellite/**.py"

jobs:
  check-generated-files:
    name: Check generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Generate client code
        run: satellite-client-generate -o generated.py
      - name: Compare generated code with committed code
        run: diff -q --text generated.py src/satellite/client/_generated_base_client.py
