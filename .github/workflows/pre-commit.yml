on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pre-commit:
    name: Run prek (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run pre-commit (prek) on the changed files
        uses: j178/prek-action@v2.0.6
        with:
          extra-args: --from-ref origin/${{ github.base_ref }} --to-ref HEAD
